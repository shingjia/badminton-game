services:

  # ------------------------------------------------------------
  # nginx: reverse proxy, host port 8000
  # ------------------------------------------------------------
  nginx:
    image: badminton-game-nginx:latest
    ports:
      - "8000:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - appnet

  # ------------------------------------------------------------
  # app: Next.js application
  # ------------------------------------------------------------
  app:
    # QNAP Container Station cannot build; uses pre-loaded image.
    # Build first on Ubuntu:
    #   docker build -t badminton-game-app:latest .
    image: badminton-game-app:latest
    environment:
      DATABASE_URL: "postgresql://app:app@db:5432/badminton?schema=public"
      ADMIN_PASSWORD: "123456"
      SESSION_SECRET: "dev-secret-must-be-32-chars-or-more-xxxxxxxxxxxxx"
      PORT: "3000"
      NODE_ENV: production
    volumes:
      # Persist uploaded images to a named volume (avoids bind-mount perms).
      - uploads_data:/app/data/uploads
    expose:
      - "3000"
    # QNAP legacy compose parser only accepts array-form depends_on.
    # app may start before db is ready; restart: unless-stopped retries.
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - appnet

  # ------------------------------------------------------------
  # db: PostgreSQL 16, only exposed inside the docker network
  # ------------------------------------------------------------
  db:
    image: postgres:16-alpine
    # privileged: true grants all Linux capabilities and bypasses the
    # default seccomp/AppArmor profiles. Diagnostic to check whether
    # QNAP Container Station's default security profile is what blocks
    # postgres initdb with EPERM on postmaster.pid and pg_wal writes.
    # If this finally lets initdb finish, the root cause is confirmed
    # security-profile related and we can decide whether to accept the
    # cost or switch to an external DB.
    privileged: true
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: badminton
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d badminton"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - appnet

  # ------------------------------------------------------------
  # cloudflared: Cloudflare Zero Trust Tunnel
  # Tunnel service URL http://nginx:80
  # ------------------------------------------------------------
  cloudflared:
    image: docker.996.ninja/cloudflare/cloudflared:latest-data-1
    networks:
      - appnet
    entrypoint: ["cloudflared"]
    command: tunnel --no-autoupdate run --token eyJhIjoiZGY5Y2EwMzMzNmEwMjFkNDJkYzg3NDA0NmU4ZmQzZGEiLCJ0IjoiYjZhMTgxYzAtMGFjMC00YzEyLWEyOWUtNjk5MmNjNjkyY2Y0IiwicyI6Ik56aGpNVGc1TkdJdE5HUmxPUzAwTVdNeUxXSmtaamt0T0RVMU9XTTFaREpqTlRKaCJ9
    restart: unless-stopped

networks:
  appnet:

volumes:
  pgdata:
  uploads_data:
