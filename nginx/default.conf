server {
    listen 80;
    server_name _;

    # ──────────────────────────────────────────────────────────────
    # 用 Docker 內建 DNS (127.0.0.11) 做動態解析。
    # 把 upstream 寫在變數裡，nginx 啟動時不會立刻解析；
    # 直到第一個 request 進來才去查 app:3000，
    # 避免 app 容器晚一兩秒起來時 nginx 因 "host not found" 直接 emerg 死掉。
    # ──────────────────────────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_app http://app:3000;

    # 上傳大小限制（例如匯入賽程檔案）
    client_max_body_size 10M;

    # ──────────────────────────────────────────────────────────────
    # WebSocket 支援（Socket.IO 需要 upgrade）
    # ──────────────────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass $upstream_app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 連線保持時間
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ──────────────────────────────────────────────────────────────
    # 一般 HTTP 流量（Next.js App Router）
    # ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass $upstream_app;

        proxy_http_version 1.1;
        # Next.js 的 HMR 也走 WS，統一帶上 upgrade header
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 避免 proxy 對靜態資源快取不一致
        proxy_cache_bypass $http_upgrade;
    }
}
